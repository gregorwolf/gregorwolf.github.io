name: marp-to-pages
concurrency: marp-to-pages

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Marp Build (CAP-heute-und-morgen)
        uses: docker://marpteam/marp-cli:v4.2.3
        with:
          args: -I CAP-heute-und-morgen/ -o CAP-heute-und-morgen/
        env:
          MARP_USER: root:root

      - name: Add Content-Security-Policy (CSP) meta tag
        run: sed -i 's|</title>|</title><meta http-equiv="Content-Security-Policy" content="default-src '"'"'unsafe-inline'"'"'; img-src * data:;" />|' CAP-heute-und-morgen/presentation.html

      - name: Git status
        run: git status

      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Deploy production
        if: ${{ github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./
          clean-exclude: pr-preview/
